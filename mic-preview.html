<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이크 아이콘 후보 3종 미리보기</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 2rem;
        }
        h2 { margin-bottom: 0.5rem; }
        .preview-container {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            width: 220px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .icon-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-box img {
            width: 32px;
            height: 32px;
        }
        .title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
        .desc { font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <h2>🎙️ 마이크 아이콘 3종 미리보기</h2>
    <p style="color: #94a3b8; margin-top: 0;">원하시는 스타일의 번호를 말씀해 주시면 입력창에 바로 적용해 드립니다.</p>

    <div class="preview-container">
        <div class="card">
            <div class="icon-box">
                <img src="mic-option1-line.svg" alt="옵션 1">
            </div>
            <div class="title">1번: 라인 미니멀</div>
            <div class="desc">슬림하고 깔끔한 라인 형태의 정석 디자인</div>
        </div>

        <div class="card">
            <div class="icon-box">
                <img src="mic-option2-solid.svg" alt="옵션 2">
            </div>
            <div class="title">2번: 소프트 볼드</div>
            <div class="desc">선명하고 눈에 잘 띄는 두꺼운 실루엣 디자인</div>
        </div>

        <div class="card">
            <div class="icon-box">
                <img src="mic-option3-gradient.svg" alt="옵션 3">
            </div>
            <div class="title">3번: AI 그라데이션</div>
            <div class="desc">블루-퍼플 색상의 입체적이고 트렌디한 디자인</div>
        </div>
    </div>
</body>
</html>
