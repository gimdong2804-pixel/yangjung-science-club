<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="atomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Atom Orbits -->
    <ellipse cx="0" cy="0" rx="60" ry="160" fill="none" stroke="url(#atomGradient)" stroke-width="24" transform="rotate(0)" stroke-linecap="round" />
    <ellipse cx="0" cy="0" rx="60" ry="160" fill="none" stroke="url(#atomGradient)" stroke-width="24" transform="rotate(60)" stroke-linecap="round" />
    <ellipse cx="0" cy="0" rx="60" ry="160" fill="none" stroke="url(#atomGradient)" stroke-width="24" transform="rotate(120)" stroke-linecap="round" />
    
    <!-- Nucleus (Y for Yangjung) -->
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" />
    <path d="M -12 -12 L 0 4 L 12 -12 M 0 4 L 0 16" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
